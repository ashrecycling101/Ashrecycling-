<script>
        const stickerInput = document.getElementById('sticker-input');
        const uploadPlaceholder = document.getElementById('upload-placeholder');
        const previewContainer = document.getElementById('preview-container');
        const stickerPreview = document.getElementById('sticker-preview');
        const scanStatus = document.getElementById('scan-status');
        const retryScanBtn = document.getElementById('retry-scan-btn');

        const brandInput = document.getElementById('brand');
        const modelInput = document.getElementById('model');
        const serialInput = document.getElementById('serial_number');
        const verifyForm = document.getElementById('verifyForm');
        const submitBtn = document.getElementById('submit-btn');
        const submitFeedback = document.getElementById('submit-feedback');

        let compressedBase64Image = '';

        const setStatusBanner = (type, message) => {
            scanStatus.classList.remove('hidden', 'bg-mossGreen/30', 'border-neonGreen', 'text-neonGreen', 'bg-amberGold/15', 'border-amberGold', 'text-amberGold', 'bg-red-900/30', 'border-red-500', 'text-red-300');
            if (type === 'loading') {
                scanStatus.classList.add('bg-mossGreen/30', 'border-neonGreen', 'text-neonGreen');
                scanStatus.innerHTML = `<i class="ph ph-spinner-gap animate-spin text-xl shrink-0"></i><span>${message}</span>`;
            } else if (type === 'success') {
                scanStatus.classList.add('bg-mossGreen/30', 'border-neonGreen', 'text-neonGreen');
                scanStatus.innerHTML = `<i class="ph-fill ph-check-circle text-xl shrink-0"></i><span>${message}</span>`;
            } else if (type === 'warning') {
                scanStatus.classList.add('bg-amberGold/15', 'border-amberGold', 'text-amberGold');
                scanStatus.innerHTML = `<i class="ph-fill ph-warning-circle text-xl shrink-0"></i><span>${message}</span>`;
            } else {
                scanStatus.classList.add('bg-amberGold/15', 'border-amberGold', 'text-amberGold');
                scanStatus.innerHTML = `<i class="ph-fill ph-info text-xl shrink-0"></i><span>${message}</span>`;
            }
        };

        const parseOCRText = (text) => {
            const upperText = text.toUpperCase();
            let foundBrand = '';
            let foundModel = '';
            let foundSerial = '';

            const knownBrands = ['SCEPTRE', 'SAMSUNG', 'LG', 'SONY', 'VIZIO', 'TCL', 'HISENSE', 'SHARP', 'PANASONIC', 'PHILIPS'];
            for (const brand of knownBrands) {
                if (upperText.includes(brand)) {
                    foundBrand = brand.charAt(0) + brand.slice(1).toLowerCase();
                    break;
                }
            }

            const modelMatch = text.match(/(?:MODEL|M\/N|MODEL NO\.?)\s*[:#-]?\s*([A-Z0-9\-_]{3,25})/i);
            if (modelMatch && modelMatch[1]) foundModel = modelMatch[1].trim();

            const serialMatch = text.match(/(?:SERIAL|S\/N|S\/NO|NO\.?)\s*[:#-]?\s*([A-Z0-9\-]{5,30})/i);
            if (serialMatch && serialMatch[1]) foundSerial = serialMatch[1].trim();

            return { brand: foundBrand, model: foundModel, serialNumber: foundSerial };
        };

        const runTesseractScan = async (imageSrc) => {
            setStatusBanner('loading', 'Initializing browser scanner...');

            try {
                // Check if Tesseract loaded correctly from CDN
                if (typeof Tesseract === 'undefined') {
                    throw new Error('Tesseract script not loaded');
                }

                const result = await Tesseract.recognize(
                    imageSrc,
                    'eng',
                    {
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                const percent = Math.round(m.progress * 100);
                                setStatusBanner('loading', `Reading sticker text (${percent}%)...`);
                            }
                        }
                    }
                );

                const rawText = result.data.text || '';
                const extracted = parseOCRText(rawText);
                let filledCount = 0;

                if (extracted.brand) { brandInput.value = extracted.brand; filledCount++; }
                if (extracted.model) { modelInput.value = extracted.model; filledCount++; }
                if (extracted.serialNumber) { serialInput.value = extracted.serialNumber; filledCount++; }

                if (filledCount > 0) {
                    setStatusBanner('success', 'Scan complete! Please review and fill in any missing fields.');
                } else {
                    setStatusBanner('warning', 'Photo processed successfully. Please type in your TV details below.');
                }
            } catch (err) {
                console.warn('OCR Notice:', err);
                setStatusBanner('warning', 'Photo uploaded successfully! Please enter your TV details below.');
            }
        };

        stickerInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (event) => {
                const img = new Image();
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1000;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    compressedBase64Image = canvas.toDataURL('image/jpeg', 0.80);
                    stickerPreview.src = compressedBase64Image;
                    uploadPlaceholder.classList.add('hidden');
                    previewContainer.classList.remove('hidden');
                    retryScanBtn.classList.remove('hidden');

                    await runTesseractScan(compressedBase64Image);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        retryScanBtn.addEventListener('click', () => {
            if (compressedBase64Image) {
                runTesseractScan(compressedBase64Image);
            }
        });

        verifyForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!compressedBase64Image) {
                setStatusBanner('warning', 'Please upload or take a photo of your TV sticker first.');
                return;
            }

            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="ph ph-spinner-gap animate-spin text-xl"></i> Saving Verification...';
            submitFeedback.classList.add('hidden');

            try {
                const res = await fetch('/api/submit-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        brand: brandInput.value.trim(),
                        model: modelInput.value.trim(),
                        serial_number: serialInput.value.trim(),
                        image: compressedBase64Image
                    })
                });

                const result = await res.json();

                if (res.ok && result.success) {
                    submitFeedback.className = 'mt-5 p-4 rounded-xl text-sm text-center font-medium border bg-mossGreen/30 border-neonGreen text-neonGreen';
                    submitFeedback.innerHTML = '<i class="ph-fill ph-check-circle text-lg align-middle mr-1"></i> TV label submitted and saved to MongoDB!';
                    verifyForm.reset();
                    compressedBase64Image = '';
                    previewContainer.classList.add('hidden');
                    uploadPlaceholder.classList.remove('hidden');
                    retryScanBtn.classList.add('hidden');
                    scanStatus.classList.add('hidden');
                } else {
                    throw new Error(result.error || 'Failed to save verification.');
                }
            } catch (err) {
                submitFeedback.className = 'mt-5 p-4 rounded-xl text-sm text-center font-medium border bg-amberGold/20 border-amberGold text-amberGold';
                submitFeedback.textContent = err.message || 'Submission failed. Please try again.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnHtml;
            }
        });
    </script>
